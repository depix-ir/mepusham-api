          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /store/notifications/read-all:
    post:
      summary: Mark All Notifications As Read
      operationId: markAllStoreNotificationsAsRead
      description: Mark all unread notifications for current customer as read.
      tags:
        - Store Notifications
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Success response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
