  /store/notifications/{id}/read:
    post:
      summary: Mark Single Notification As Read
      operationId: markSingleStoreNotificationAsRead
      description: Mark a specific notification as read by ID.
      tags:
        - Store Notifications
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated notification object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - notification
                properties:
                  notification:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # INVENTORY MANAGEMENT & AUDIT TRAIL
  # ---------------------------------------------------------------------------
  /admin/inventory/history:
    get:
      summary: Get Global Inventory Transaction History
      operationId: getGlobalInventoryHistory
      description: Retrieve paginated audit trail of inventory balance adjustments and transactions across all products.
      tags:
        - Admin Inventory
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: location_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [adjustment, sale, return, transfer, reservation]
      responses:
        '200':
          description: Paginated transaction list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - transactions
                  - count
                  - offset
                  - limit
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryTransaction'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/inventory/low-stock:
    get:
      summary: Get Low Stock Items Alert
      operationId: getLowStockInventoryAlerts
      description: Retrieve inventory items operating below low stock threshold levels.
      tags:
        - Admin Inventory
      security:
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of low stock inventory items.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # CUSTOMER SUPPORT TICKETING
  # ---------------------------------------------------------------------------
  /store/tickets:
    get:
      summary: List Customer Support Tickets
      operationId: listStoreTickets
      description: Retrieve support tickets created by or associated with the logged-in customer.
      tags:
        - Store Support Tickets
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of tickets.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tickets
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create Customer Support Ticket
      operationId: createStoreTicket
      description: Open a new customer support ticket with atomic TKT-YYYY-XXXXXX ticket number generation.
      tags:
        - Store Support Tickets
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - subject
                - message
              properties:
                category_id:
                  type: string
                subject:
                  type: string
                message:
                  type: string
                order_id:
                  type: string
                product_id:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                  default: normal
      responses:
        '201':
          description: Support ticket created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ticket
                properties:
                  ticket:
                    $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/tickets:
    get:
      summary: List Admin Support Tickets
      operationId: listAdminTickets
      description: Retrieve paginated support tickets with status and priority filtering for customer service operators.
      tags:
        - Admin Support Tickets
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: assigned_to_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated ticket list for admin.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tickets
                  - count
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # SIZE GUIDES MANAGEMENT
  # ---------------------------------------------------------------------------
  /admin/size-guides/templates:
    get:
      summary: List Size Guide Templates
      operationId: listAdminSizeGuideTemplates
      description: Retrieve reusable size guide layout templates.
      tags:
        - Admin Size Guides
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Size guide templates list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - templates
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/SizeGuideTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create Size Guide Template
      operationId: createAdminSizeGuideTemplate
      description: Create a size guide template with measurement matrices.
      tags:
        - Admin Size Guides
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - columns
                - rows
              properties:
                title:
                  type: string
                description:
                  type: string
                columns:
                  type: array
                  items:
                    type: string
                rows:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - template
                properties:
                  template:
                    $ref: '#/components/schemas/SizeGuideTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /store/products/{id}/size-guide:
    get:
      summary: Get Product Size Guide
      operationId: getStoreProductSizeGuide
      description: Retrieve size guide assigned to a product.
      tags:
        - Store Size Guides
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Size guide template object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - size_guide
                properties:
                  size_guide:
                    $ref: '#/components/schemas/SizeGuideTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # MARGIN REPORTING
  # ---------------------------------------------------------------------------
  /admin/reports/margin:
    get:
      summary: Get Margin Analysis Report
      operationId: getAdminMarginReport
      description: Retrieve financial margin analysis aggregating Gross Sales, COGS, Discounts, Shipping, Tax, Net Sales, Gross Profit, and Gross Margin percentage across date ranges and product breakdowns.
      tags:
        - Admin Reports
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, week, month, product, variant, category]
            default: day
      responses:
        '200':
          description: Financial margin report.
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - breakdown
                properties:
                  summary:
                    type: object
                    required:
                      - gross_sales
                      - net_sales
                      - cogs
                      - gross_profit
                      - gross_margin_percentage
                    properties:
                      gross_sales:
                        type: number
                      discounts:
                        type: number
                      taxes:
                        type: number
                      shipping:
                        type: number
                      refunds:
                        type: number
                      net_sales:
                        type: number
                      cogs:
                        type: number
                      gross_profit:
                        type: number
                      gross_margin_percentage:
                        type: number
                  breakdown:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # PHONE OTP AUTHENTICATION
  # ---------------------------------------------------------------------------
  /auth/phone/send-otp:
    post:
      summary: Send Phone OTP Code
      operationId: sendPhoneOtpCode
      description: Dispatch verification OTP code to customer's Iranian mobile number (`09...` or `+989...`).
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "09123456789"
      responses:
        '200':
          description: OTP code sent successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/phone/verify:
    post:
      summary: Verify Phone OTP Code
      operationId: verifyPhoneOtpCode
      description: Verify OTP code and issue JWT session token for customer.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  example: "09123456789"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - customer
                properties:
                  token:
                    type: string
                  customer:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  responses:
    BadRequest:
      description: Invalid request parameters or body schema validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication bearer token / session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
        - type
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string

    Brand:
      type: object
      required:
        - id
        - name
        - slug
        - is_active
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        logo_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      required:
        - id
        - name
        - slug
        - is_active
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        display_order:
          type: integer
        parent_category_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Media:
      type: object
      required:
        - id
        - original_filename
        - file_key
        - url
      properties:
        id:
          type: string
        original_filename:
          type: string
        file_key:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        storage_provider:
          type: string
        url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        uploaded_by_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreAddress:
      type: object
      required:
        - id
        - title
        - recipientName
        - phone
        - province
        - city
        - address
        - postalCode
      properties:
        id:
          type: string
        title:
          type: string
        recipientName:
          type: string
        recipient_name:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        address:
          type: string
        plaque:
          type: string
          nullable: true
        floor:
          type: string
          nullable: true
        postalCode:
          type: string
        postal_code:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoreSettings:
      type: object
      required:
        - id
        - storeName
        - contactPhone
        - supportEmail
        - address
        - taxRate
        - enableSmsNotifications
        - enableEmailNotifications
        - returnWindowDays
        - autoApproveReturns
        - addresses
      properties:
        id:
          type: string
        storeName:
          type: string
        contactPhone:
          type: string
        supportEmail:
          type: string
        address:
          type: string
        taxRate:
          type: number
        enableSmsNotifications:
          type: boolean
        enableEmailNotifications:
          type: boolean
        returnWindowDays:
          type: integer
        autoApproveReturns:
          type: boolean
        defaultShippingAddressId:
          type: string
          nullable: true
        defaultReturnAddressId:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/StoreAddress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      required:
        - id
        - receiver_id
        - channel
        - template
        - data
      properties:
        id:
          type: string
        receiver_id:
          type: string
        channel:
          type: string
        template:
          type: string
        data:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    InventoryTransaction:
      type: object
      required:
        - id
        - inventory_item_id
        - location_id
        - quantity_change
        - type
      properties:
        id:
          type: string
        inventory_item_id:
          type: string
        location_id:
          type: string
        quantity_change:
          type: integer
        type:
          type: string
          enum: [adjustment, sale, return, transfer, reservation]
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Ticket:
      type: object
      required:
        - id
        - ticket_number
        - customer_id
        - category_id
        - subject
        - status
        - priority
      properties:
        id:
          type: string
        ticket_number:
          type: string
          example: "TKT-2026-000123"
        customer_id:
          type: string
        category_id:
          type: string
        subject:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        order_id:
          type: string
          nullable: true
        product_id:
          type: string
          nullable: true
        assigned_to_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SizeGuideTemplate:
      type: object
      required:
        - id
        - title
        - columns
        - rows
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
